<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Elemental Duel</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1730;--panel:#2a2547;--ink:#f3ecdd;--dim:#a59fc0;--c:#3aa8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#0e0b1a;color:var(--ink);font-family:system-ui,sans-serif;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:720px;height:360px;background:var(--bg);overflow:hidden;transform-origin:center}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:14px 28px;text-align:center;gap:10px}
.screen.on{display:flex}
h1,h2{font-family:'Lilita One',system-ui,sans-serif;font-weight:400;margin:0}
h1{font-size:40px;line-height:1}
h2{font-size:26px}
p{margin:0;color:var(--dim);font-size:15px;line-height:1.4}
.btn{border:0;border-radius:16px;padding:14px 22px;background:var(--c);color:#1b1730;font-family:'Lilita One',system-ui;font-size:20px;width:100%}
.btn.alt{background:var(--panel);color:var(--ink)}
.btn:disabled{opacity:.5}
input{width:100%;padding:14px;border-radius:16px;border:2px solid #ffffff22;background:var(--panel);color:var(--ink);font-family:'Lilita One',system-ui;font-size:26px;text-align:center;letter-spacing:8px;text-transform:uppercase;-webkit-user-select:text;user-select:text;touch-action:auto}
#err{color:#ff8a8a;min-height:18px;font-size:14px}
#code{font-family:'Lilita One',system-ui;font-size:54px;letter-spacing:10px;color:var(--ink)}
#lobby{gap:12px}
#diff{display:flex;gap:8px;width:260px}
.dbtn{padding:10px 6px;font-size:18px}
.dbtn.sel{background:var(--c);color:#1b1730}
.col{display:flex;flex-direction:column;gap:10px;flex:1;align-items:center;max-width:300px}
#cards{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%}
.card{--c:#fff;border:2px solid var(--c);border-radius:20px;background:var(--panel);color:var(--ink);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit}
.card .pt{width:56px;height:56px;display:block}
.card b{font-family:'Lilita One',system-ui;font-weight:400;font-size:14px}
.card i{font-style:normal;font-size:11px;color:var(--dim)}
.card.mine{background:color-mix(in srgb,var(--c) 30%,var(--panel))}
.card.taken{border-style:dashed;border-color:#ffffff33}
.card:disabled{opacity:.45}
.card.mine:disabled{opacity:1}
#fight{padding:0;gap:0;justify-content:flex-start}
canvas{width:720px;height:360px;display:block}
#controls{position:absolute;inset:0;display:none;pointer-events:none}
#cbar{position:absolute;left:0;right:0;bottom:0;height:98px;padding:0 14px 12px;display:flex;justify-content:space-between;align-items:stretch}
#controls .g{display:flex;gap:8px;pointer-events:none}
#controls .cb{pointer-events:auto}
.cb{border:0;border-radius:16px;background:var(--panel);color:var(--ink);font-family:'Lilita One',system-ui;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px #ffffff22}
.cb small{font-family:system-ui;font-size:10px;color:var(--dim)}
#bb,#bf{width:72px;font-size:30px}
.ud{display:flex;flex-direction:column;gap:8px;width:108px}
.ud .cb{flex:1;font-size:36px}
#bp{width:98px;background:var(--c);color:#1b1730;font-size:20px}
#bp small{color:#1b1730aa}
#bs{width:92px}
#bgb{position:absolute;right:14px;top:62px;width:96px;height:66px;font-size:22px;background:#ffd166;color:#1b1730}
#bgb small{color:#1b1730aa}
#bfly{position:absolute;right:14px;top:134px;width:96px;height:66px;font-size:22px;background:#9be7ff;color:#1b1730;display:none}
#bfly small{color:#1b1730aa}
#bu{width:82px;background:linear-gradient(to top,#ffd16688 var(--p,0%),var(--panel) var(--p,0%))}
.cb.ready{box-shadow:inset 0 0 0 3px var(--c)}
@keyframes ublink{
  0%,100%{filter:brightness(1);box-shadow:inset 0 0 0 3px #ffd166,0 0 0 0 #ffd16600;transform:scale(1)}
  50%{filter:brightness(1.9);box-shadow:inset 0 0 0 3px #fff,0 0 18px 5px #ffd166cc;transform:scale(1.06)}
}
#bu.ready{animation:ublink .65s ease-in-out infinite}
.cb.down{transform:scale(.94);filter:brightness(1.2)}
.cb.off{opacity:.45}
#cdnum{position:absolute;left:0;right:0;top:28%;text-align:center;font-family:'Lilita One',system-ui;font-size:80px;pointer-events:none;display:none;text-shadow:0 4px 20px #000a}
#over{position:absolute;inset:0;background:#0e0b1acc;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px}
#over.on{display:flex}
#over .btn{width:240px}
#rotate{position:fixed;inset:0;z-index:9;background:#0e0b1a;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-family:'Lilita One',system-ui;font-size:26px;color:#f3ecdd}
</style>
</head>
<body>
<div id="rotate">Rotate your phone sideways to play</div>
<div id="stage">

  <div id="lobby" class="screen on">
    <h1>Elemental Duel</h1>
    <p>You vs the computer. First to win 2 rounds.</p>
    <div id="diff">
      <button class="btn alt dbtn" data-d="0">Easy</button>
      <button class="btn alt dbtn sel" data-d="1">Normal</button>
      <button class="btn alt dbtn" data-d="2">Hard</button>
    </div>
    <button class="btn" id="play" style="width:260px">Play</button>
  </div>

  <div id="select" class="screen">
    <h2>Choose your fighter</h2>
    <div id="cards"></div>
    <p id="selmsg"></p>
  </div>

  <div id="fight" class="screen">
    <canvas id="cv" width="720" height="360"></canvas>
    <div id="cdnum"></div>
    <div id="controls">
      <button class="cb" id="bgb">Grab<small>again: throw</small></button>
      <button class="cb" id="bfly">Fly<small>6s, every 8s</small></button>
      <div id="cbar">
      <div class="g">
        <button class="cb" id="bb">◀</button>
        <div class="ud">
          <button class="cb" id="bup">▲</button>
          <button class="cb" id="bdn">▼</button>
        </div>
        <button class="cb" id="bf">▶</button>
      </div>
      <div class="g">
        <button class="cb" id="bp">Punch<small>tap again: kick</small></button>
        <button class="cb" id="bs">Special<small>every 7s</small></button>
        <button class="cb" id="bu">Ultimate<small>every 11s</small></button>
      </div>
      </div>
    </div>
    <div id="over">
      <h2 id="otitle"></h2>
      <p id="osub"></p>
      <button class="btn" id="rematch">Rematch</button>
      <button class="btn alt" id="menu">Menu</button>
    </div>
  </div>

  <div id="gone" class="screen">
    <h2>Connection ended</h2>
    <p>Your friend left or the connection dropped.</p>
    <button class="btn" style="width:240px" onclick="location.href=location.pathname">Back to start</button>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
const F = [
  {name:'Water', icon:'💧', c:'#3aa8ff'},
  {name:'Fire',  icon:'🔥', c:'#ff6a3d'},
  {name:'Wind',  icon:'🌪️', c:'#7ee6c4'},
  {name:'Soil',  icon:'🪨', c:'#b9824a'},
  {name:'Sickle', icon:'🔥', c:'#ff4fa0'},
  {name:'Propeller', icon:'🚁', c:'#b48cff'},
  {name:'Boomerang', icon:'🪃', c:'#9d3dff'},
  {name:'Flower', icon:'🌸', c:'#ff3b4e'},
  {name:'Renjana', icon:'🐄', c:'#9be04a'},
  {name:'Miss Goliath', icon:'🐰', c:'#ffd23f'},
  {name:'Merpati', icon:'🕊️', c:'#8fd0ff'},
  {name:'Kak Ros', icon:'🔥', c:'#ff2fa8'}
];
const ULTN = ['Unicorn Storm','Lava Monster','Panda Storm','Forest Grip','Flame Rider','Bamboo Juggle','Mermaid Lash','Hornet Rain','Fire Cow','Giant Rope','Giant Dove','Crimson Giant'];
const BEASTS = ['Elephant','Yeti','Gorilla'];
const SP = [ /* special moves, one per element */
  {k:'wj',   v:560, y:46, r:12, dmg:9,  kb:120, st:200, wet:true},
  {k:'fb',   v:340, y:24, r:15, dmg:12, kb:160, st:280, hb:true},
  {k:'gust', v:300, y:66, r:40, dmg:7,  kb:300, st:300},
  {k:'rock', v:300, y:42, r:18, dmg:14, kb:180, st:300},
  {k:'sickle', v:380, y:42, r:16, dmg:11, kb:140, st:260, pierce:true},
  {k:'bflame', v:330, y:32, r:15, dmg:12, kb:150, st:260, ev:30},
  {k:'boom', v:400, y:60, r:14, dmg:9, kb:110, st:220, sy:38},
  {k:'flow', v:340, y:46, r:16, dmg:11, kb:140, st:260},
  {k:'whip', v:420, y:48, r:16, dmg:10, kb:130, st:240, thr:30},     /* Renjana: 30% the enemy is thrown */
  {k:'bunny', v:360, y:52, r:16, dmg:11, kb:140, st:260, thr:30},    /* Miss Goliath: 30% the enemy is thrown */
  {k:'stickrain', v:0, y:0, r:0, dmg:0, kb:0, st:0},                 /* Merpati: sticks fall on the enemy's head (see stickRain) */
  {k:'dollb', v:420, y:50, r:14, dmg:7, kb:120, st:220},             /* Kak Ros: blue-shirt doll */
  {k:'dolly', v:420, y:64, r:14, dmg:7, kb:120, st:220}              /* Kak Ros: yellow-shirt doll (index 12, fired right after the blue one) */
];
const PRE = 'eduel2-';
/* ---------- sound effects ---------- */
const SFX = {
  hit:  ['https://gjyeknwtoofpuvoaftfj.supabase.co/storage/v1/object/public/suara/combat.mp3', 'https://gjyeknwtoofpuvoaftfj.supabase.co/storage/v1/object/public/suara/punch1.mp3'],     /* punch + got hit: one of these at random */
  fire: ['https://gjyeknwtoofpuvoaftfj.supabase.co/storage/v1/object/public/suara/apio.mp3'],
  boom: ['https://gjyeknwtoofpuvoaftfj.supabase.co/storage/v1/object/public/suara/lrdak.mp3']
};
const SFXA = {}, sfxLast = {};
for (const k in SFX) SFXA[k] = SFX[k].map(u => { const a = new Audio(u); a.preload = 'auto'; return a; });
function playSfx(k){
  const now = performance.now(); if (now - (sfxLast[k] || 0) < 70) return; sfxLast[k] = now;
  const l = SFXA[k]; if (!l) return;
  const a = l[Math.floor(Math.random()*l.length)].cloneNode(); a.volume = k === 'boom' ? 1 : .8;
  const pr = a.play(); if (pr && pr.catch) pr.catch(() => {});
}
/* The floor is a band: feet can stand anywhere from y=ZF (far away) to y=GYN (close to the viewer). z = 0..ZD */
const ZF = 216, ZD = 52, GYN = ZF + ZD;
/* The arena is 2x wider than the screen; the camera follows the fighters. A cut line marks the middle. */
const WW = 1440, MAXGAP = 600;
const STARTS = {2:[WW/2 - 210, WW/2 + 210], 3:[WW/2 - 260, WW/2, WW/2 + 260]};
let START = STARTS[2];
const mkD = () => ({f:START.map(x => ({x, y:0, z:ZD/2, hp:100, lx:x, lz:ZD/2})), e:{}, p:{}});
const ps = z => 1.10 + .16 * (Math.max(0, Math.min(ZD, z)) / ZD);   /* fighters look bigger when closer */

function fit(){
  const s = Math.min(innerWidth/720, innerHeight/360);
  $('stage').style.transform = `translate(-50%,-50%) scale(${s})`;
  $('rotate').style.display = innerHeight > innerWidth ? 'flex' : 'none';
}
addEventListener('resize', fit); fit();

/* ---------- state ---------- */
let peer, isHost = false, me = 0, phase = 'lobby';
let picks = [null,null], fighters = [null,null], pend = false;
let G = null, tickId = null, lastT = 0;
const blankF = (x, fd) => ({x, y:0, z:ZD/2, fd, hp:100, a:0, ch:0, sp:false, sn:0, u:false, s:false, r:false, sh:false, bn:false, hd:0, fy:false, fr:false, hi:false});
let V = {f:[blankF(START[0], 1), blankF(START[1], -1)], e:[], p:[]};
let D = mkD();
let parts = [], texts = [], shake = 0, banner = null, tiltT = [0,0,0];
let score = [0,0], round = 1, bgT = 0;      /* bgT = seconds of fighting so far; picks the scene */
const WINS = 2;                          /* rounds needed to win the duel */
let cam = 0;
const X = x => (1 ? x : WW - x) - cam;   /* each phone shows itself on the left; cam scrolls the wide arena */

function show(id){ document.querySelectorAll('.screen').forEach(e => e.classList.toggle('on', e.id === id)); }
function err(msg){ $('err').textContent = msg; $('create').disabled = false; $('joinbtn').disabled = false; show('lobby'); phase = 'lobby'; }
let conns = [], hostConn = null, N = 2;
function send(m){ if (isHost) conns.forEach(c => { if (c.open) c.send(m); }); else if (hostConn && hostConn.open) hostConn.send(m); }

/* ---------- single player: you are always player 0 and the host; the computer is player 1 ---------- */
let vsCpu = false, level = 1, aiId = null;
function startCpu(){
  isHost = true; me = 0; N = 2; vsCpu = true; conns = [];
  clearInterval(aiId); aiId = setInterval(aiTick, LV[level].tick);
  resetSelect();
}

/* ---------- select ---------- */
function goSelect(){
  phase = 'select'; $('over').classList.remove('on'); $('controls').style.display = 'none';
  $('cdnum').style.display = 'none'; show('select');
}
function resetSelect(){
  clearInterval(tickId); G = null; bgT = 0; picks = Array(N).fill(null); pend = false; score = Array(N).fill(0); round = 1;
  goSelect(); broadcastSel(); renderSelect();
}
function broadcastSel(){ send({t:'sel', picks}); }
function pick(i, f){
  if (picks[i] !== null || picks.includes(f)) return false;
  picks[i] = f; broadcastSel(); renderSelect();
  if (picks.every(p => p !== null)) setTimeout(startCountdown, 900);
  return true;
}
function choose(k){
  pick(0, k);
  setTimeout(() => {
    if (phase !== 'select' || picks[1] !== null) return;
    const free = F.map((_, i) => i).filter(i => !picks.includes(i));
    if (free.length) pick(1, free[Math.floor(Math.random()*free.length)]);
  }, 600);
}
function renderSelect(){
  const box = $('cards'); box.innerHTML = '';
  F.forEach((f,k) => {
    const o = picks.indexOf(k), b = document.createElement('button');
    b.className = 'card' + (o === me ? ' mine' : o >= 0 ? ' taken' : '');
    b.style.setProperty('--c', f.c);
    b.innerHTML = `<canvas class="pt" width="140" height="140"></canvas><b>${f.name}</b><i>${o===me?'Yours':o>=0?'Taken':'Tap to pick'}</i>`;
    const pc = b.firstChild.getContext('2d');
    pc.translate(70, 86); pc.scale(.92, .92);
    drawChar(pc, k, {a:0, air:false, mv:false, flash:false, s:false}, 0);
    b.disabled = o >= 0 || picks[me] !== null || pend;
    b.onclick = () => choose(k);
    box.appendChild(b);
  });
  const left = picks.filter(p => p === null).length;
  $('selmsg').textContent =
    picks[me] === null ? 'Tap a fighter. The computer picks one too.' :
    left > 0 ? 'Locked in. The computer is choosing…' : 'Everyone is ready. Get set!';
}

/* ---------- countdown ---------- */
function startCountdown(){
  let n = 3;
  const step = () => {
    send({t:'cd', n}); cdShow(n);
    if (n === 0) { beginFight(); return; }
    n--; setTimeout(step, 1000);
  };
  step();
}
function enterFight(){
  fighters = picks.slice(); N = fighters.length; START = STARTS[N];
  V = {f:START.map((x, i) => blankF(x, dir(i))), e:[], p:[]};
  D = mkD();
  parts = []; texts = []; banner = null; held.b = held.f = held.u = held.d = false; lastMv = 0; lastMz = 0; bgCur = -1;
  $('stage').style.setProperty('--c', F[fighters[me]].c); cam = (WW - 720)/2;
  $('over').classList.remove('on'); $('controls').style.display = 'none';
  show('fight');
}
function cdShow(n){
  if (phase !== 'cd' && phase !== 'fight') enterFight();
  phase = 'cd';
  if (n === 3) banner = {s:'Round ' + round, c:'#f3ecdd', t0:performance.now(), dur:1800};
  const el = $('cdnum'); el.style.display = 'block'; el.textContent = n > 0 ? n : 'Fight!';
  if (n === 0) {
    phase = 'fight'; $('controls').style.display = 'flex';
    setTimeout(() => { if (phase === 'fight') el.style.display = 'none'; }, 700);
  }
}

/* ---------- host simulation (host phone decides everything) ---------- */
const dir = i => START[i] < WW/2 ? 1 : START[i] > WW/2 ? -1 : 1;      /* which way a fighter faces at the start of a round */
const r1 = v => Math.round(v*10)/10;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const later = (at, fn) => G.pend.push({at, fn});
const rm = e => { G.e = G.e.filter(x => x !== e); };
const MAXHITS = 3;                      /* punches + kicks allowed per second */
const SPMAX = 4;                        /* special presses per charge; recharges 7 s after the last one */
const DMGX = .5;                        /* every attack's damage is multiplied by this (lower = longer fights) */

/* x = left/right, z = depth (0 far .. ZD close), y = height (only from being knocked up), fd = facing (+1 world-right / -1 world-left) */
function mk(i){ return {x:START[i], y:0, z:ZD/2, vy:0, kx:0, hp:100, mv:0, mz:0, fd:dir(i), hits:[], taken:[], need:4 + Math.floor(Math.random()*3), a:0, aUntil:0, stun:0, root:0,
                        ch:0, ult:false, ultAt:0, grabAt:0, hold:null, spN:0, spGap:0, spAt:0, lastP:0, lastKind:0, cdUntil:0, shock:0, burn:0, flyUntil:0, flyCd:0, hid:false, bm:false, wet:0, hb:0, un:0, gFrom:0, gUntil:0, gm:0, glow:0, wing:0, dance:0, skel:0}; }
/* the nearest living opponent of fighter i (the one an ultimate or grab aims at) */
function foe(i){
  let b = -1, bd = 1e9;
  for (let k = 0; k < G.f.length; k++){ if (k === i || G.f[k].hp <= 0) continue; const d = Math.abs(G.f[k].x - G.f[i].x); if (d < bd){ bd = d; b = k; } }
  return b < 0 ? (i + 1) % G.f.length : b;
}
function beginFight(){
  const now = performance.now();
  G = {f:fighters.map((_, i) => mk(i)), e:[], p:[], pend:[], eid:0, over:false}; G.p = mkProps(); G.fly = null; G.beastAt = nextBeast(now);
  G.f.forEach(f => { f.spN = 0; f.spAt = now + 7000; f.spGap = 0; f.ultAt = now + 11000; f.flyCd = now + 2500; });
  fighters.forEach((el, i) => { if (el === 2) spawnPandas(i); if (el === 7) spawnPlants(i); if (el === 8) spawnCart(i); });
  if (fighters.includes(8)) G.p.forEach(p => { if (p.k === 'bear') p.x = 575; else if (p.k === 'tv') p.x = 865; });   /* make room for the cow cart in the middle */
  lastT = now; clearInterval(tickId); tickId = setInterval(loop, 33);
}

/* ---------- wind fighter's panda squad ---------- */
const PANDA_SLOTS = [-120, -62, 66, 124], PANDA_ZO = [-16, 14, 12, -14];
function spawnPandas(i){
  const f = G.f[i];
  PANDA_SLOTS.forEach((off, n) => G.e.push({id:++G.eid, k:'panda', o:i, n, off, zo:PANDA_ZO[n],
    x:clamp(f.x + off, 40, WW-40), y:0, z:clamp(f.z + PANDA_ZO[n], 0, ZD), age:0, mode:'idle', tx:f.x + off, wt:0,
    fd:f.fd, walk:false, done:false, doneAt:0}));
}
function pandaRush(i, now){
  G.e.filter(e => e.k === 'panda' && e.o === i).forEach(p =>
    later(now + 350 + p.n*320, () => { p.mode = 'atk'; p.done = false; p.tg = foe(i); }));
}
function pandaTick(p, dt, now){
  const tgi = (p.tg !== undefined) ? p.tg : foe(p.o), f = G.f[p.o], en = G.f[tgi];
  let goal = null, sp = 0, gz = clamp(f.z + p.zo, 0, ZD), zs = 45;
  if (p.mode === 'atk'){
    if (en.hp <= 0) p.mode = 'ret';
    else if (!p.done){
      goal = en.x; sp = 450; gz = en.z; zs = 230;
      if (Math.abs(en.x - p.x) < 52 && Math.abs(en.z - p.z) < 18){
        p.done = true; p.doneAt = now;
        const last = p.n === 3, dx = Math.sign(en.x - p.x) || p.fd;
        damage(tgi, last ? 10 : 5, last ? 460 : 130, last ? 650 : 260, last, last ? 430 : 0, dx);
      }
    } else {
      gz = p.z;
      p.fd = Math.sign(en.x - p.x) || p.fd;
      if (now - p.doneAt > 420) p.mode = 'ret';
    }
  }
  if (p.mode === 'ret'){
    goal = f.x + p.off; sp = 260; zs = 160;
    if (Math.abs(goal - p.x) < 6){ p.mode = 'idle'; p.tx = goal; p.wt = now + 900; goal = null; }
  } else if (p.mode === 'idle'){
    if (now >= p.wt){
      p.tx = clamp(f.x + (Math.random()*300 - 150), 34, WW-34);
      p.wt = now + 1400 + Math.random()*2400;
    }
    goal = p.tx; sp = 44;
  }
  let walking = false;
  if (goal !== null){
    const d = goal - p.x;
    if (Math.abs(d) > 3){ p.x += Math.sign(d) * Math.min(Math.abs(d), sp*dt); p.fd = Math.sign(d); walking = true; }
  }
  const dz = gz - p.z;
  if (Math.abs(dz) > .5){ p.z = clamp(p.z + clamp(dz, -zs*dt, zs*dt), 0, ZD); walking = true; }
  p.walk = walking;

/* ---------- Miss Goliath: grows giant, a rope hangs the enemy, 4 punches, the last one throws him far ---------- */
const GSC = 1.4, GOL_PUNCH = [600, 1150, 1700, 2250], GOL_HANG_Y = 72, GOL_DIST = 90;
function giantScale(f, now){
  if (now >= f.gUntil) return 1;
  const k = Math.min(clamp((now - f.gFrom)/600, 0, 1), clamp((f.gUntil - now)/500, 0, 1));
  return 1 + ((f.gm || GSC) - 1)*k*k*(3 - 2*k);
}
function goliathUlt(i, now){
  const f = G.f[i], tgi = foe(i), en = G.f[tgi], d = Math.sign(en.x - f.x) || f.fd;
  f.fd = d; f.gFrom = now; f.gUntil = now + 4300; f.root = Math.max(f.root, now + 3700);
  tx(f, 'Goliath!', '#ffd23f');
  later(now + 700, () => {
    if (en.hp <= 0 || f.hp <= 0) return;
    if (en.hold) dropHold(tgi);
    const rope = {id:++G.eid, k:'grope', o:i, tg:tgi, x:en.x, y:0, z:en.z, age:0, fd:d, tx:en.x, ty:en.y, tz:en.z, pn:0};
    G.e.push(rope); tx(en, 'Hanged!', '#ffd166');
    GOL_PUNCH.forEach((t0, n) => later(performance.now() + t0, () => {
      if (!G.e.includes(rope) || en.hp <= 0) return;
      const nw = performance.now(), last = n === GOL_PUNCH.length - 1;
      f.a = 1; f.aUntil = nw + 330; rope.pn = nw; ev({k:'snd', n:'hit'});
      if (last){ rm(rope); damage(tgi, 20, 2300, 1200, true, 450, d); tx(en, 'Thrown!', '#ffd166'); }   /* rope lets go, enemy flies */
      else damage(tgi, 7, 0, 600, true, 0, d);
    }));
  });
}
function gropeTick(e, dt, now){
  const f = G.f[e.o], en = G.f[e.tg];
  if (en.hp <= 0 || f.hp <= 0 || e.age > 4500){ rm(e); return; }
  const sp = e.pn ? now - e.pn : 0, sway = e.pn ? 34*Math.exp(-sp/230)*Math.sin(sp/48) : 0;   /* each punch swings him */
  const k = clamp(12*dt, 0, 1);
  en.x += (clamp(f.x + e.fd*(GOL_DIST + sway), 40, WW - 40) - en.x)*k;

}

/* ---------- Renjana ultimate #2: three cow carts roll in; one breathes fire, one ice, one rocks ---------- */
const TRI_IN = 900, TRI_CH = 700, TRI_BD = 900, TRI_END = 4700, ICE_MS = 800;       /* ms: roll in, charge, blow length, leave, freeze time */
const TRI_BL = {fire:1500, ice:2300, rock:3100};                                     /* when each cart starts to blow */
const triOpen = (m, a) => { const bl = TRI_BL[m]; return a < bl - TRI_CH ? 0 : a < bl ? (a - (bl - TRI_CH))/TRI_CH : a < bl + TRI_BD - 250 ? 1 : Math.max(0, (bl + TRI_BD - a)/250); };
function cartTrioUlt(i, now){
  const f = G.f[i], tgi = foe(i), en = G.f[tgi];
  G.e = G.e.filter(x => !(x.k === 'ccart' && x.o === i));                           /* the fire cow drives away while the three are here */
  later(now + TRI_END + 200, () => { if (!G.e.some(x => x.k === 'ccart' && x.o === i)) spawnCart(i); });
  const cx = (f.x + en.x)/2;
  [['fire', -1, -250], ['ice', 1, 0], ['rock', 1, 250]].forEach(([mode, side, off]) => {
    const px = clamp(cx + off, 100, WW - 100);
    const c = {id:++G.eid, k:'ecart', o:i, tg:tgi, mode, x:px + side*640, y:0, z:0, age:0, fd:-side, sx:px + side*640, px, side};
    G.e.push(c);
    G.e.push({id:++G.eid, k:'ebr', o:i, tg:tgi, mode, cid:c.id, x:c.x, y:0, z:0, age:0, fd:c.fd, tx:en.x, ty:en.y, tz:en.z});
  });
  tx(f, 'Three carts!', '#ffd166');
}
function ecartTick(e, dt, now){
  const f = G.f[e.o], en = G.f[e.tg];
  if (en.hp <= 0 || f.hp <= 0 || e.age >= TRI_END){ rm(e); return; }
  const a = e.age;
  if (a < TRI_IN){ const k = 1 - Math.pow(1 - a/TRI_IN, 3); e.x = e.sx + (e.px - e.sx)*k; e.fd = -e.side; }
  else if (a < TRI_END - 500){ e.x = e.px; e.fd = Math.sign(en.x - e.x) || e.fd; }
  else { const k = (a - (TRI_END - 500))/500; e.x = e.px + e.side*k*k*700; e.fd = e.side; }     /* rolls away on its own side */
}
function ebrTick(e, dt, now){
  const cart = G.e.find(x => x.id === e.cid), en = G.f[e.tg];
  if (!cart || en.hp <= 0 || e.age > TRI_BL[e.mode] + TRI_BD + 400){ rm(e); return; }
  e.x = cart.x; e.z = cart.z; e.fd = cart.fd; e.tx = en.x; e.ty = en.y; e.tz = en.z;
  const T = TRI_BL[e.mode] + 200, dir = Math.sign(en.x - cart.x) || cart.fd;
  if (e.age >= TRI_BL[e.mode] && !e.snd){ e.snd = true; ev({k:'snd', n: e.mode === 'fire' ? 'fire' : 'hit'}); }
  if (e.hit || e.age < T) return;
  e.hit = true;
  if (e.mode === 'fire'){
    ev({k:'snd', n:'boom'});
    damage(e.tg, 10, 260, 500, true, 260, dir); tx(en, 'Burned!', '#ff9a4d');
    en.burn = now + 4000;
    for (let n = 1; n <= 8; n++) later(now + n*400, () => { if (en.hp > 0 && !en.hid) damage(e.tg, 3, 0, 0, false); });
  } else if (e.mode === 'ice'){
    damage(e.tg, 6, 0, 0, false); tx(en, 'Frozen!', '#9fe0ff');
    if (en.hold) dropHold(e.tg);
    en.stun = Math.max(en.stun, now + ICE_MS); en.root = Math.max(en.root, now + ICE_MS);
    en.a = 0; en.flyUntil = 0; en.kx = 0;

    damage(e.tg, 18, 2300, 1200, true, 450, dir); tx(en, 'Thrown!', '#ffd166');
  }

function applyInput(i, k, d){

  else if (k === 'p') doMelee(i);
  else if (k === 's') doSpecial(i);
  else if (k === 'u') doUlt(i);
  else if (k === 'g') doGrab(i);
  else if (k === 'f') doFly(i);

function handleEv(m){

    const mz = m.z || 0, x = X(m.x), y = ZF + mz - m.y - 58*ps(mz), col = F[fighters[m.i]].c;

    texts.push({x:X(m.x), y:ZF + mz - (m.y || 0) - 130*ps(mz), s:m.s, c:m.c, t0:now});
  } else if (m.k === 'beast'){

  }
}

/* ---------- input ---------- */
let lastMv = 0, lastMz = 0; const held = {b:false, f:false, u:false, d:false};
function sendInput(k, d){
  if (phase !== 'fight') return;
  if (isHost) applyInput(0, k, d); else send({t:'in', k, d});
}
function updMv(){
  const v = (held.f?1:0) - (held.b?1:0); if (v !== lastMv){ lastMv = v; sendInput('mv', v); }
  const z = (held.d?1:0) - (held.u?1:0); if (z !== lastMz){ lastMz = z; sendInput('mz', z); }   /* up = farther, down = closer */
}
function holdBtn(btn, key){
  btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.setPointerCapture(e.pointerId); btn.classList.add('down'); held[key] = true; updMv(); });
  const off = () => { btn.classList.remove('down'); held[key] = false; updMv(); };

const dk = (hex, f = .78) => { const n = parseInt(hex.slice(1), 16);
  return '#' + [16,8,0].map(s => Math.round(((n >> s) & 255) * f).toString(16).padStart(2,'0')).join(''); };

const mixHex = (a, b, f) => { const x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
  return '#' + [16,8,0].map(q => Math.round(((x >> q) & 255)*(1 - f) + ((y >> q) & 255)*f).toString(16).padStart(2,'0')).join(''); };

function skelC(k){ if (!SKELC[k]) SKELC[k] = Object.assign({}, CH[k], {skin:'#efe9d6', hair:'#d6cfba', hi:'#fffaf0', top:'#e6dfca', trim:'#d3cbb0', pants:'#dcd5bf', belt:'#c4bca2', shoe:'#ebe5d0', au:'#efe9d6', al:'#efe9d6', fc:'#efe9d6'}); return SKELC[k]; }
const RAGEC = {};
function rageC(k){ if (!RAGEC[k]) RAGEC[k] = Object.assign({}, CH[k], {hair:'#ff2a1a', hi:'#ffb36a'}); return RAGEC[k]; }

  if (!WETC[k]){ const b = CH[k], c = Object.assign({}, b);
    ['top','trim','pants','belt','shoe','au'].forEach(q => { if (q === 'au' && b.au === b.skin) return; c[q] = dk(mixHex(b[q], '#2d6fb0', .38), .8); });

/* two-bone limb: returns elbow/knee and the (reach-clamped) end point */
function ik(ax, ay, bx, by, l1, l2, sg){
  const dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy) || 1, m = Math.min(d, l1 + l2 - .01), a = Math.atan2(dy, dx);
  const c = Math.max(-1, Math.min(1, (l1*l1 + m*m - l2*l2) / (2*l1*m))), ang = Math.acos(c) * sg;
  return [ax + Math.cos(a + ang)*l1, ay + Math.sin(a + ang)*l1, ax + Math.cos(a)*m, ay + Math.sin(a)*m];
}

  g.fillStyle = '#ffffff22'; for (let k = 0; k < 4; k++) circ(g, 40 + k*180, 30 + rnd()*40, 16, '#ffffff10');
  for (const [fx, fy, c] of [[120,70,'#ffb347'],[170,92,'#ffb347'],[250,54,'#7be0ff'],[560,76,'#ff7aa8'],[610,60,'#ff7aa8'],[330,100,'#ffe14d']]){   /* little fish */
    g.fillStyle = c; g.beginPath(); g.ellipse(fx, fy, 12, 6, 0, 0, 7); g.fill(); shape(g, [[fx+10,fy],[fx+20,fy-6],[fx+20,fy+6]], c);
    circ(g, fx - 6, fy - 1.5, 1.6, '#18122b'); }
  gr = g.createLinearGradient(0,HZ,0,360); gr.addColorStop(0,'#cdb77f'); gr.addColorStop(1,'#a38b57');   /* sandy seabed */
  g.fillStyle = gr; g.fillRect(0, HZ + 6, 720, 360);
  g.fillStyle = '#07305f55'; g.fillRect(0, HZ + 6, 720, 14);
  g.strokeStyle = '#ffffff30'; g.lineWidth = 2;
  for (let k = 0; k < 16; k++){ const y = HZ + 16 + rnd()*140, x = rnd()*660; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 30, y - 5, x + 60, y); g.stroke(); }
  for (let k = 0; k < 14; k++){ const x = rnd()*720, y = HZ + 20 + rnd()*135; g.fillStyle = k % 2 ? '#e8ddc0' : '#c4a672';
    g.beginPath(); g.ellipse(x, y, 5 + rnd()*5, 3 + rnd()*2, rnd(), 0, 7); g.fill(); }
  for (const [sx, sy] of [[90,HZ+60],[330,HZ+110],[560,HZ+80],[680,HZ+130]]){                              /* starfish */
    g.fillStyle = '#ff6a4d'; g.beginPath(); for (let a = 0; a < 10; a++){ const r = a % 2 ? 4 : 10, an = a*.628 - 1.57; g.lineTo(sx + Math.cos(an)*r, sy + Math.sin(an)*r*.6); } g.closePath(); g.fill(); }
  g.fillStyle = '#6f6a7a'; for (let k = 0; k < 7; k++){ g.beginPath(); g.ellipse(30 + k*110 + rnd()*40, HZ + 40 + rnd()*110, 14 + rnd()*10, 8 + rnd()*4, 0, Math.PI, 0); g.fill(); }
}

const BGS = []; let bgCur = -1, bgPrev = 0, bgT0 = 0;
function drawBg(img){                                    /* scenery scrolls slowly behind the fighters (mirrored tile = no seam) */
  const o = cam*.3;
  ctx.drawImage(img, -o, 0);
  ctx.save(); ctx.translate(1440 - o, 0); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0); ctx.restore();
}
function drawArena(now){
  if (!BGS.length) BGS.push(mkBg(bgSakura), mkBg(bgSoccer), mkBg(bgHouse), mkBg(bgJungle), mkBg(bgOcean));
  const b = V.bg || 0;
  if (bgCur < 0){ bgCur = bgPrev = b; bgT0 = now; }
  if (b !== bgCur){ bgPrev = bgCur; bgCur = b; bgT0 = now; }          /* new scene: fade over 0.7 s */
  const k = Math.min(1, (now - bgT0)/700);
  if (k >= 1) bgPrev = bgCur;
  drawBg(BGS[bgPrev]);
  if (bgCur !== bgPrev){ ctx.globalAlpha = k; drawBg(BGS[bgCur]); ctx.globalAlpha = 1; }
  const wj = bgCur === 0 ? (bgPrev === 0 ? 1 : k) : (bgPrev === 0 ? 1 - k : 0);   /* how visible the Japan scene is */
  if (wj > .02){                                                      /* drifting sakura petals */
    ctx.fillStyle = '#ffc2d4'; ctx.globalAlpha = .85*wj;
    for (let i = 0; i < 26; i++){
      const sp = 14 + (i*7) % 22, x = ((i*83 + now*sp/1000 + Math.sin(now/900 + i)*18) % 760) - 20, y = ((i*47 + now*sp*.9/1000) % 400) - 20;
      ctx.beginPath(); ctx.ellipse(x, y, 4.2, 2.3, now/700 + i, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  const vis = n => bgCur === n ? (bgPrev === n ? 1 : k) : (bgPrev === n ? 1 - k : 0), vjn = vis(3), voc = vis(4);
  if (vjn > .02){                                                     /* jungle: fireflies */
    ctx.save(); ctx.fillStyle = '#fff6a0'; ctx.shadowColor = '#fff6a0'; ctx.shadowBlur = 8;
    for (let i = 0; i < 18; i++){
      const x = (i*97 + Math.sin(now/1300 + i)*30 + 720) % 720, y = 60 + (i*41) % 190 + Math.sin(now/900 + i*2)*10;
      ctx.globalAlpha = vjn*(.25 + .45*Math.max(0, Math.sin(now/420 + i*1.7))); disc(x, y, 2.2);
    }
    ctx.restore();
  }
  if (voc > .02){                                                     /* ocean: rising bubbles */
    ctx.save(); ctx.strokeStyle = '#d8f3ff'; ctx.lineWidth = 1.3;
    for (let i = 0; i < 24; i++){
      const x = (i*71 + Math.sin(now/700 + i)*8 + 720) % 720, y = 370 - ((i*53 + now*(18 + (i % 5)*8)/1000) % 390), r = 2 + i % 4;
      ctx.globalAlpha = .55*voc; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke();
    }
    ctx.restore();
  }
  ctx.fillStyle = '#ffffff0f'; ctx.fillRect(-20, ZF - 7, 760, ZD + 16);   /* the walkable lane band */
  ctx.fillStyle = '#ffffff26'; ctx.fillRect(-20, ZF - 7, 760, 2); ctx.fillRect(-20, GYN + 9, 760, 2);
  /* the cut line: appears in the middle of the screen when the fighters get too far apart */
  const alv = D.f.filter((d, i) => V.f[i] && V.f[i].hp > 0), axs = (alv.length ? alv : D.f).map(d => d.x), gapNow = Math.max(...axs) - Math.min(...axs), near = clamp((gapNow - (MAXGAP - 140))/140, 0, 1), lx = X((Math.max(...axs) + Math.min(...axs))/2);
  if (near > 0){
    ctx.save(); ctx.globalAlpha = near*(near >= 1 ? .8 + .2*Math.sin(now/90) : 1); ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 10;
    const lg = ctx.createLinearGradient(0, 56, 0, 360); lg.addColorStop(0, '#ffffff00'); lg.addColorStop(.35, '#ffffffcc'); lg.addColorStop(1, '#ffffffcc');
    ctx.strokeStyle = lg; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(lx, 56); ctx.lineTo(lx, 360); ctx.stroke(); ctx.restore();
  }
}

function draw(){
  requestAnimationFrame(draw);
  if (fighters.some(f => f === null) || !$('fight').classList.contains('on')) return;
  const now = performance.now();

  for (let i=0;i<D.f.length;i++){ const t = V.f[i], d = D.f[i]; if (!t) continue;
    d.lx = d.x; d.lz = d.z; d.x += (t.x - d.x)*.45; d.y += (t.y - d.y)*.5; d.z += (t.z - d.z)*.5; d.hp += (t.hp - d.hp)*.18; }
  const live = {};
  for (const e of V.e){ let d = D.e[e.id]; if (!d) d = D.e[e.id] = {x:e.x, y:e.y, z:e.z};
    d.x += (e.x - d.x)*.5; d.y += (e.y - d.y)*.5; d.z += (e.z - d.z)*.5; live[e.id] = 1; }
  for (const id in D.e) if (!live[id]) delete D.e[id];
  const liveP = {};
  for (const p of V.p || []){ let d = D.p[p.id]; if (!d) d = D.p[p.id] = {x:p.x, y:p.y, z:p.z};
    d.x += (p.x - d.x)*.5; d.y += (p.y - d.y)*.5; d.z += (p.z - d.z)*.5; liveP[p.id] = 1; }
  for (const id in D.p) if (!liveP[id]) delete D.p[id];
  { const al = D.f.filter((d, i) => V.f[i] && V.f[i].hp > 0), xs = (al.length ? al : D.f).map(d => d.x), mx = (Math.min(...xs) + Math.max(...xs))/2, vm = mx;     /* camera follows the middle of the two fighters */
    cam += (Math.max(0, Math.min(WW - 720, vm - 360)) - cam)*.2; }

  ctx.save(); ctx.clearRect(0,0,720,360);
  if (shake > 0){ ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake); shake *= .86; if (shake < .5) shake = 0; }

  drawArena(now);

  /* everything standing on the floor is drawn far-to-near so closer fighters cover farther ones */
  const isBack = e => e.k === 'fplant' || e.k === 'tank' || e.k === 'tree' || e.k === 'uni' || e.k === 'icem' || e.k === 'ccart' || e.k === 'ecart' || (e.k === 'panda' && e.m !== 'atk');
  const items = D.f.map((d, i) => ({z:d.z, f:i}));
  for (const e of V.e){
    const d = D.e[e.id];
    items.push({z: (e.k === 'lava' || e.k === 'fcrack' || e.k === 'ggiant') ? -999 : (e.k === 'flood' || e.k === 'bolt' || e.k === 'bamboo' || e.k === 'mermaid' || e.k === 'hornet' || e.k === 'grope' || e.k === 'cfire' || e.k === 'ebr' || e.k === 'rlaser' || e.k === 'sdance') ? 999 : (d.z || 0) + (isBack(e) ? -.1 : .1), e});
  }
  for (const p of V.p || []){ const d = D.p[p.id]; items.push({z: p.h >= 0 ? D.f[p.h].z + .2 : d.z - .05, p}); }
  items.sort((p, q) => p.z - q.z);
  for (const it of items){ if (it.e) drawEnt(it.e, D.e[it.e.id], now); else if (it.p) drawProp(it.p, D.p[it.p.id], now); else drawFighter(it.f, now); }

  parts = parts.filter(q => q.l > 0);
  for (const q of parts){
    q.x += q.vx; q.y += q.vy; q.vy += .2; q.l -= .028;
    ctx.globalAlpha = Math.max(0, q.l); ctx.fillStyle = q.c; disc(q.x, q.y, q.r);
  }
  ctx.globalAlpha = 1;

  texts = texts.filter(t => now - t.t0 < 900);
  ctx.textAlign = 'center'; ctx.font = FONT(22);
  for (const t of texts){ const k = (now - t.t0)/900; ctx.globalAlpha = 1 - k; ctx.fillStyle = t.c; ctx.fillText(t.s, t.x, t.y - k*34); }
  ctx.globalAlpha = 1;

  hud(me); V.f.forEach((_, k) => { if (k !== me) hud(k); });
  if (banner && now - banner.t0 < (banner.dur || 1500)){
    const k = (now - banner.t0)/(banner.dur || 1500);
    ctx.globalAlpha = k < .7 ? 1 : 1 - (k-.7)/.3; ctx.fillStyle = banner.c; ctx.font = FONT(38); ctx.textAlign = 'center';
    ctx.fillText(banner.s, 360, 110); ctx.globalAlpha = 1;
  }
  ctx.restore();

  const m = V.f[me], lv = phase === 'fight';
  $('bs').firstChild.textContent = 'Special' + (m.sn > 0 ? ' ×' + m.sn : '');
  $('bs').classList.toggle('ready', lv && m.sp); $('bs').classList.toggle('off', !lv || !m.sp);
  const uOk = lv && !m.u && m.ch >= 100;
  $('bu').style.setProperty('--p', (m.u ? 0 : m.ch) + '%');
  $('bu').classList.toggle('ready', uOk); $('bu').classList.toggle('off', !uOk && !(lv && !m.u));
  $('bu').firstChild.textContent = fighters[me] === 7 ? (m.nx ? 'Petal Storm' : 'Hornet Rain') : fighters[me] === 10 ? (m.nx ? 'Feathers' : 'Dove') : fighters[me] === 4 ? (m.nx ? 'Dance' : 'Ultimate') : fighters[me] === 8 ? (m.nx ? 'Cart Trio' : 'Fire Cow') : fighters[me] === 9 ? (m.nx ? 'Giant Grip' : 'Giant Rope') : 'Ultimate';
  $('bgb').firstChild.textContent = m.hd ? 'Throw' : 'Grab'; $('bgb').classList.toggle('ready', lv && !!m.hd);
  $('bfly').style.display = fighters[me] === 5 ? 'flex' : 'none';
  $('bfly').firstChild.textContent = m.fy ? 'Land' : 'Fly';
  $('bfly').classList.toggle('ready', lv && !!m.fy); $('bfly').classList.toggle('off', !lv || (!m.fy && !m.fr));
}
requestAnimationFrame(draw);


/* ---------- computer opponent (drives fighter 1 through the same inputs a player uses) ---------- */
const LV = [
  {tick:220, atk:.22, sp:.03, ult:.04, grab:.4, back:.8, wander:1.3},
  {tick:160, atk:.35, sp:.05, ult:.07, grab:.8, back:.7, wander:1},
  {tick:110, atk:.55, sp:.09, ult:.14, grab:1.2, back:.5, wander:.6}
];
const ai = {mode:'fight', dir:0, zd:0, until:0, nextP:0, combo:0, cmax:3, prop:0, propUntil:0, holdAt:0};
const aiSet = (k, d) => applyInput(1, k, d);
function aiTick(){
  if (!vsCpu || !G || G.over || phase !== 'fight') return;
  const L = LV[level], now = performance.now(), f = G.f[1], o = G.f[0];
  if (f.hp <= 0 || o.hp <= 0 || f.hid || now < f.stun) return;
  const dx = o.x - f.x, ad = Math.abs(dx), sg = dx >= 0 ? 1 : -1, dz = o.z - f.z;
  const facing = f.fd === sg, zAlign = Math.abs(dz) > 9 ? Math.sign(dz) : 0, rnd = Math.random;
  let mv = 0, mz = zAlign;

  if (f.hold){                                         /* carrying something: line up and throw it */
    if (!ai.holdAt) ai.holdAt = now + 250 + rnd()*500;
    if (!facing) mv = sg;
    else if (ad < 480 && !zAlign && now >= ai.holdAt){ aiSet('g'); ai.holdAt = 0; }
    else if (ad > 300) mv = sg;
    aiSet('mv', mv); aiSet('mz', mz); return;
  }
  ai.holdAt = 0;

  if (ai.mode === 'prop'){                             /* walk to a chair / bear / tv / fridge and pick it up */
    const p = G.p.find(q => q.id === ai.prop);
    if (!p || p.h >= 0 || p.fl || now > ai.propUntil) ai.mode = 'fight';
    else {
      const pdx = p.x - f.x, ps0 = Math.sign(pdx) || 1, pdz = p.z - f.z;
      mz = Math.abs(pdz) > 8 ? Math.sign(pdz) : 0;
      if (Math.abs(pdx) > 40 || f.fd !== ps0) mv = ps0;
      else if (!mz){ aiSet('g'); ai.mode = 'fight'; }
    }
  } else if (ai.mode === 'back' && now < ai.until && f.x > 90 && f.x < WW - 90){   /* hit and run */
    mv = -sg; mz = rnd() < .5 ? mz : 0;
  } else if (ai.mode === 'wander' && now < ai.until && f.x > 90 && f.x < WW - 90){   /* strolls around, often backwards */
    mv = ai.dir; mz = ai.zd;
  } else {
    ai.mode = 'fight';
    if (rnd() < L.wander*.05){                         /* nothing to do: wander off for a moment */
      const r = rnd();
      ai.mode = 'wander'; ai.until = now + 900 + rnd()*1800;
      ai.dir = r < .55 ? -sg : r < .8 ? 0 : sg; ai.zd = Math.floor(rnd()*3) - 1;
    }
    const inRange = ad < 78 && Math.abs(dz) < 14;
    if (!inRange) mv = ad > 62 ? sg : (facing ? 0 : sg);
    else if (!facing) mv = sg;

    if (inRange && facing && now >= ai.nextP && rnd() < L.atk){             /* punches, then a kick */
      aiSet('p'); ai.nextP = now + 260 + rnd()*280;
      if (++ai.combo >= ai.cmax){
        ai.combo = 0; ai.cmax = 2 + Math.floor(rnd()*2); ai.nextP = now + 900 + rnd()*1400;   /* then a breather */
        if (rnd() < L.back){ ai.mode = 'back'; ai.until = now + 400 + rnd()*500; }
      }
    }
    if (facing && ad > 120 && ad < 560 && Math.abs(dz) < 18 && f.spN > 0 && rnd() < L.sp) aiSet('s');
    if (now >= f.ultAt && ad < 460 && o.hp > 0 && !o.hid && rnd() < L.ult) aiSet('u');
    if (inRange && facing && rnd() < .004*L.grab) aiSet('g');
    if (rnd() < .009*L.grab){                                               /* sometimes go and grab a prop */
      let best = null, bd = 450;
      for (const p of G.p){ if (p.h >= 0 || p.fl || p.y > 8) continue; const d = Math.abs(p.x - f.x); if (d < bd){ bd = d; best = p; } }
      if (best){ ai.mode = 'prop'; ai.prop = best.id; ai.propUntil = now + 4000; }
    }
  }
  aiSet('mv', mv); aiSet('mz', mz);
}

document.querySelectorAll('.dbtn').forEach(b => b.onclick = () => {
  level = +b.dataset.d; document.querySelectorAll('.dbtn').forEach(x => x.classList.toggle('sel', x === b));
});
$('play').onclick = () => startCpu();
$('menu').onclick = () => location.reload();
